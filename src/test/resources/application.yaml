spring:
  jpa:
    show-sql: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop

  datasource:
    url: jdbc:h2:mem:mygraduation

  cache:
    type: caffeine
    cache-names: restaurant_with_menu, menus_by_restaurant, vote_results, today_winner
    caffeine:
      spec: maximumSize=10, expireAfterWrite=1m
